name: Validate and build

on:
  workflow_dispatch:
  push:
    paths:
      - .github/build-trigger

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build frontend
        run: npm run build

      - name: Syntax-check Home Assistant integration
        run: python3 -m compileall -q custom_components/music_assistant_dashboard

      - name: Upload Home Assistant bundle
        uses: actions/upload-artifact@v4
        with:
          name: music-assistant-dashboard
          path: |
            dist/music-assistant-dashboard-card.js
            custom_components/music_assistant_dashboard/**
          if-no-files-found: error
