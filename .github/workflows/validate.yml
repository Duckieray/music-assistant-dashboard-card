name: Validate and build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax-check Home Assistant integration
        run: python3 -m compileall -q custom_components/music_assistant_dashboard

      - name: Typecheck, build frontend, and package HACS release
        run: bash scripts/build-hacs-package.sh

      - name: Upload validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: music-assistant-dashboard
          path: |
            dist/music-assistant-dashboard-card.js
            custom_components/music_assistant_dashboard/**
            music_assistant_dashboard.zip
          if-no-files-found: error
