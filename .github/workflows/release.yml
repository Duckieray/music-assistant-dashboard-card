name: Publish HACS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax-check Home Assistant integration
        run: python3 -m compileall -q custom_components/music_assistant_dashboard

      - name: Build HACS package
        run: bash scripts/build-hacs-package.sh

      - name: Verify release version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          expected = tag[1:] if tag.startswith("v") else tag
          manifest = json.loads(Path("custom_components/music_assistant_dashboard/manifest.json").read_text())
          package = json.loads(Path("package.json").read_text())
          if manifest["version"] != expected or package["version"] != expected:
              raise SystemExit(
                  f"Version mismatch: tag={tag}, manifest={manifest['version']}, package={package['version']}"
              )
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            music_assistant_dashboard.zip \
            --target "${GITHUB_SHA}" \
            --title "Music Assistant Dashboard $TAG" \
            --generate-notes
